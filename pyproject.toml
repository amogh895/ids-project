[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ids-project"
version = "2.0.0"
description = "Advanced Real-World Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Amogh Dixit"},
]

dependencies = [
    # === Data & ML Core ===
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",           # parquet support
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.11.0",  # SMOTE
    "optuna>=3.4.0",             # hyperparameter tuning
    "shap>=0.43.0",              # explainability
    "joblib>=1.3.0",

    # === Deep Learning ===
    "torch>=2.1.0",              # autoencoder

    # === MLOps ===
    "mlflow>=2.9.0",

    # === Backend (FastAPI) ===
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # password hashing
    "python-multipart>=0.0.6",           # file uploads
    "websockets>=12.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",           # async Postgres driver
    "alembic>=1.13.0",           # migrations
    "aiosqlite>=0.19.0",         # async SQLite fallback

    # === PCAP Processing ===
    "scapy>=2.5.0",

    # === Observability ===
    "structlog>=23.2.0",
    "rich>=13.7.0",              # pretty console output

    # === Configuration ===
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # === Utilities ===
    "tqdm>=4.66.0",
    "httpx>=0.25.0",             # async HTTP client for webhooks
    "tenacity>=8.2.0",           # retry logic
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",             # FastAPI TestClient
    "ruff>=0.1.0",               # linting
    "mypy>=1.7.0",               # type checking
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
